<html>
    <head>
        <title>
            Line Diagram Performance Log Viewer
        </title>
        <script>
            let PERF_DATA = [];
            const parseData = ()=>{
                fetch("perf_line-diagram.results_log").then(response=>response.text()).then(text => {
                    PERF_DATA = JSON.parse(`[${text}]`);
                })
            }
          

            const doFilters = () => {
                let filtered_data = [...PERF_DATA];
                if(host_filter.value.length){
                    filtered_data = filtered_data.filter(row => row.host == host_filter.value);
                }
                if(route_filter.value.length){
                    filtered_data = filtered_data.filter(row => row.route == route_filter.value);
                }
                if(sample_filter.value.length){
                    filtered_data = filtered_data.filter(row => row.samples == sample_filter.value);
                }
                filtered_data = filtered_data.filter(
                    ({timestamp})=>(timestamp>=start_filter.valueAsNumber-(tz_elem.value*3600000.0))
                ).filter(
                    ({timestamp})=>(timestamp<=end_filter.valueAsNumber-(tz_elem.value*3600000.0))
                )

                renderData(filtered_data)
            }

            const renderData = (filtered_data)=>{
                const vAxisMax = filtered_data.reduce((acc, row)=>{
                    if(row.results.full > acc){return row.results.full}
                    return acc;
                },0);
                const new_data = filtered_data.filter(({newVersion})=>newVersion);
                const old_data = filtered_data.filter(({newVersion})=>!newVersion);
                let old_chart_data = google.visualization.arrayToDataTable([
                    ["Time", "TTFB", "DOM", "Full"],
                    ...old_data.map(row=>(
                        [new Date(row.timestamp), row.results.ttfb, row.results.dom, row.results.full]
                    ))
                ])
                let new_chart_data = google.visualization.arrayToDataTable([
                    ["Time", "TTFB", "DOM", "Full"],
                    ...new_data.map(row=>(
                        [new Date(row.timestamp), row.results.ttfb, row.results.dom, row.results.full]
                    ))
                ])
              
                let old_chart = new google.visualization.AreaChart(old_chart_elem);
                let new_chart = new google.visualization.AreaChart(new_chart_elem);
                old_chart.draw(old_chart_data, {title: `${filtered_data[0].route} (old)`, vAxis:{maxValue: vAxisMax}});
                new_chart.draw(new_chart_data, {title: `${filtered_data[0].route} (new)`, vAxis:{maxValue: vAxisMax}});

            }
        </script>
        <script src="https://www.gstatic.com/charts/loader.js"></script>
        <script>
        google.charts.load('current', {packages: ['corechart']});
        
        </script>
    </head>
    <body>
        <h1>Line Diagram Performance Results Viewer</h1>
        <div>
            <h2>Filters:</h2>
            <div >
                <form action="#" onSubmit="doFilters()" style="display:flex;flex-direction:row;justify-content:space-evenly;">
                    <div class="filter">
                        Host: <input type='text' value='https://dev-blue.mbtace.com' id="host_filter"/>
                    </div>
                    <div class="filter">
                        Route: 
                        <select id="route_filter">
                            <option value="Green">Green</option>
                            <option value="230" selected>230</option>
                            <option value="CR-Franklin">CR-Franklin</option>
                            <option value="Boat-F2H">Boat-F2H</option>
                        </select>
                    </div>
                    <div class="filter">
                        Samples: <input type='text' value='10' id="sample_filter" style="width:3em;"/>
                    </div>
                    <div class="filter">
                        Start time: <input type="datetime-local" id="start_filter"/>
                    </div>
                    <div class="filter">
                        End time: <input type="datetime-local" id="end_filter" />
                    </div>
                    <div class="filter">
                        Timezone: <select id="tz_elem">
                            <option value="-4">EDT (-4)</option>
                            <option value="-5">EST (-5)</option>
                        </select>
                    </div>
                    <input type="submit" value="Filter"/>
                </form>
            </div>
            <div>
                <h2>Results:</h2>
                <div class="chart_elem" id="old_chart_elem"></div>
                <div class="chart_elem" id="new_chart_elem"></div>
            </div>
        </div>
    </body>
    <script>
        parseData();
        end_filter.valueAsNumber = Math.floor(Date.now()/60000) * 60000 + (tz_elem.value * 1.0)*3600000;
        start_filter.valueAsNumber = end_filter.valueAsNumber - 3600000;
    </script>
</html>
